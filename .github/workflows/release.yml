name: Create tagged release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (currently v1.1.2)
        required: true
        default: v1.1.2
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify source and data
        run: .\scripts\Verify-Repository.ps1
      - name: Build offline
        run: .\build.ps1
      - name: Test without a game process
        run: .\scripts\Test-Offline.ps1
      - name: Assemble individual files and full/light ZIPs
        run: .\scripts\New-Release.ps1 -Tag $env:RELEASE_TAG
      - name: Create a draft release without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw 'GitHub CLI is required on the runner.' }
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh release view $env:RELEASE_TAG --json id 2>$null
            $releaseExists = $LASTEXITCODE -eq 0
          } finally { $ErrorActionPreference = $previousPreference }
          if ($releaseExists) { throw 'A release for this tag already exists; it was left unchanged.' }
          $folder = Join-Path $PWD ('dist\release\'+$env:RELEASE_TAG)
          $assets = @(Get-ChildItem -LiteralPath $folder -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title ('PriPara Arcade Remote '+$env:RELEASE_TAG) --notes-file (Join-Path $folder 'RELEASE_NOTES.txt')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
